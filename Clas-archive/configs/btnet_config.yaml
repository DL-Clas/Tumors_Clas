# BTNet-TS Configuration File
# This file defines the architecture hyperparameters and training protocols.

model:
  name: "BTNet-TS"
  attention_module: "ER-3DA" 
  backbone: "Group-DenseNet"
  
  # GCF-2S Hyperparameters (Graph Convolutional Feature extraction)
  # K values correspond to superpixel nodes for GCN1, GCN2, and GCN3 layers
  # These are set based on feature map complexity at different network depths
  gcn_nodes_k: [16, 9, 4]
  adjacency_rule: "SLIC-boundary-neighbor" # Based on segmented spatial boundaries
  
  # MFS-GD (Multi-scale Feature Fusion) settings
  fusion_strategy: "Dense-Aggregation"
  growth_rate: 32

dataset:
  # Supported datasets: BTD-3, BTD-4, BTD-44
  input_size: [224, 224]
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  
  # Split Protocol: Strictly patient-level for BTD-3
  # Deduplicated image-wise for BTD-4 and BTD-44
  split_ratio: 0.8 # Train/Test ratio (8:2)

training:
  # Matched experimental pipeline parameters
  batch_size: 16
  optimizer: "Adam"
  initial_lr: 1.0e-3
  min_lr: 1.0e-5
  weight_decay: 0.0
  epochs: 100
  
  # Reproducibility settings
  seed: 42
  init_strategy: "Xavier" # Xavier uniform initialization for weights
  early_stopping:
    monitor: "val_loss"
    patience: 15
  
  # Evaluation methodology
  cross_validation_folds: 5 # Mandatory for robustness assessment
  independent_runs: 10      # For statistical significance (Welch's t-test)

augmentation:
  # Standard spatial transformations
  random_horizontal_flip: 0.5
  random_rotation_degrees: 15
  interpolation: "bilinear"

robustness_test:
  # Failure mode analysis parameters (Discussion Sec. 5.3)
  gaussian_noise_sigma: [0.01, 0.05, 0.1]
  gaussian_blur_kernel: [3, 5, 7]
